<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Max Consulta · Chat</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="./styles.css?v=20260315-chat-1" />
  <script src="./chat.js?v=20260315-chat-1" defer></script>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="logo" aria-label="Max Consulta">
          <svg viewBox="0 0 48 48" aria-hidden="true">
            <path fill="currentColor" d="M12 34V14c0-1 .8-2 2-2h3l7 11 7-11h3c1.2 0 2 .9 2 2v20c0 1.1-.9 2-2 2h-3V22.7l-6 9.4c-.4.6-1 .9-1.7.9s-1.3-.3-1.7-.9l-6-9.4V36h-3c-1.1 0-2-.9-2-2z"/>
            <rect x="25.5" y="10" width="3.5" height="25" rx="6" fill="#ffffff" opacity="0.78" transform="rotate(32 31 24)"/>
          </svg>
        </div>
        <div class="brand-text">
          <div class="brand-name">Max Consulta</div>
          <div class="brand-sub">Chat · acceso con PIN</div>
        </div>
      </div>

      <div class="topbar-actions">
        <a class="icon-btn" href="./index.html" style="text-decoration:none;" title="Volver">← Volver</a>
        <button class="icon-btn" id="btnNewChat" title="Nuevo chat">Nuevo</button>
      </div>
    </header>

    <main class="content">
      <section class="filters card">
        <div class="filters-row">
          <span class="filters-label">Área</span>
          <div class="segmented segmented-area" role="tablist" aria-label="Área">
            <button class="seg-btn active" data-collection="" type="button">Todas</button>
            <button class="seg-btn" data-collection="laboral" type="button">Laboral</button>
            <button class="seg-btn" data-collection="fiscal" type="button">Fiscal</button>
            <button class="seg-btn" data-collection="seguridad_social" type="button">Seg. Social</button>
            <button class="seg-btn" data-collection="BOCM" type="button">BOCM</button>
            <button class="seg-btn" data-collection="Estatuto_trabajadores" type="button">Estatuto</button>
            <button class="seg-btn" data-collection="Convenios_Madrid" type="button">Convenios_Madrid</button>
          </div>
          <div class="select-group">
            <label for="tone">Tono</label>
            <select id="tone">
              <option value="neutro" selected>Neutro</option>
              <option value="formal">Formal</option>
            </select>
          </div>
        </div>
      </section>

      <section class="grid">
        <article class="card" style="grid-column: 1 / -1;">
          <div class="answer-head">
            <h2 class="card-title">Chat</h2>
            <span class="muted">API: <span id="apiLabel">—</span></span>
          </div>

          <div id="chatLog" class="answer-box" style="min-height: 360px;"></div>

          <div class="cta-row" style="align-items:stretch;">
            <textarea id="msg" placeholder="Escribe tu mensaje… (Ctrl/Cmd + Enter para enviar)"></textarea>
            <button class="primary" id="btnSend">Enviar</button>
            <span class="hint">Este chat usa la documentación indexada y mantiene contexto en esta sesión.</span>
          </div>
        </article>
      </section>
    </main>

    <footer class="footer">
      <span class="muted">Max Consulta · chat interno</span>
    </footer>
  </div>
</body>
</html>
